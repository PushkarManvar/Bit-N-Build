[project]
name = "journeylens-backend"
version = "0.1.0"
description = "JourneyLens FastAPI backend"
requires-python = ">=3.12"

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = [".", "scripts"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
